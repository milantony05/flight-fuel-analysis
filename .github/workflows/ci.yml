name: CI

on:
  push:
    branches: [main, research-extension]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -v -s tests
      - run: python -m flight_fuel.advanced
      - name: Validate generated research artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("reports/advanced-results.json").read_text())
          assert report["rows"] == 7619
          assert set(report["policies"]) == {
              "risk_only", "greedy_floor", "optimized_floor", "calibrated_floor"
          }
          observed = report["uncertainty"]["observed_interval_coverage"]
          assert 0.85 <= observed <= 0.95
          comparisons = report["uncertainty_comparison"]
          assert set(comparisons) == {
              "global_scaled_conformal", "duration_mondrian", "aircraft_mondrian"
          }
          assert comparisons["duration_mondrian"]["worst_group_coverage"] >= 0.85
          assert report["aircraft_held_out_risk_calibration"]["eligible_aircraft_types"] >= 5
          assert len(report["natural_adsb_availability"]) >= 3
          assert len(report["risk_score_sensitivity"]["scenarios"]) == 3
          protocol = json.loads(Path("configs/confirmatory-protocol.json").read_text())
          assert protocol["status"] == "prospective_protocol_no_confirmatory_labels_loaded"
          assert {row["id"] for row in protocol["primary_hypotheses"]} == {"H1", "H2", "H3"}
          dashboard = Path("demo/index.html").read_text()
          assert "Flight Fuel Intelligence Dashboard" in dashboard
          assert "Robustness and transfer diagnostics" in dashboard
          assert "Publication evidence boundary" in dashboard
          assert "const DATA=" in dashboard
          assert "What is advanced—and what is not yet claimed" not in dashboard
          Path("/tmp/flight-fuel-dashboard.js").write_text(
              dashboard.split("<script>", 1)[1].split("</script>", 1)[0]
          )
          PY
          node --check /tmp/flight-fuel-dashboard.js
